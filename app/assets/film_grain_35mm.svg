<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Filtro de Ruido Fractal para Grano Analógico 35mm (ISO 400) -->
  <filter id="analogGrain35mm">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise" />
    <feColorMatrix type="matrix" values="
      0 0 0 0 0.13
      0 0 0 0 0.13
      0 0 0 0 0.13
      0 0 0 0.05 0" />
  </filter>
  <rect width="100%" height="100%" filter="url(#analogGrain35mm)" />
</svg>
